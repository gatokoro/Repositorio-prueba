<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego HTML - Esquiva Obstáculos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: min(95vw, 560px);
    }
    h1 { margin: 0 0 10px; font-size: 1.5rem; }
    .hud {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    button {
      background: #22c55e;
      color: #052e16;
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    #game {
      width: 100%;
      height: 420px;
      border: 2px solid #374151;
      border-radius: 10px;
      background: #0b1220;
      position: relative;
      overflow: hidden;
    }
    #player {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #38bdf8;
      bottom: 12px;
      left: calc(50% - 21px);
    }
    .obstacle {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f43f5e;
      top: -40px;
    }
    #status { min-height: 24px; margin-top: 10px; font-weight: 700; }
    .help { opacity: 0.9; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Esquiva Obstáculos</h1>
    <div class="hud">
      <span>Puntos: <strong id="score">0</strong></span>
      <span>Vidas: <strong id="lives">3</strong></span>
      <button id="startBtn">Iniciar / Reiniciar</button>
    </div>

    <section id="game" aria-label="Zona de juego">
      <div id="player" aria-label="Jugador"></div>
    </section>

    <p id="status">Pulsa "Iniciar" para empezar.</p>
    <p class="help">Mueve el jugador con las teclas ← y → para esquivar los obstáculos.</p>
  </main>

  <script>
    const game = document.getElementById('game');
    const player = document.getElementById('player');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');

    let running = false;
    let score = 0;
    let lives = 3;
    let obstacleTimer = null;
    let loopTimer = null;
    let playerX = 0;
    const playerSpeed = 18;

    function resetPlayerPosition() {
      playerX = (game.clientWidth - player.offsetWidth) / 2;
      player.style.left = `${playerX}px`;
    }

    function createObstacle() {
      if (!running) return;
      const obstacle = document.createElement('div');
      obstacle.className = 'obstacle';
      const maxX = game.clientWidth - 36;
      obstacle.style.left = `${Math.random() * maxX}px`;
      obstacle.dataset.y = '-40';
      game.appendChild(obstacle);
    }

    function intersects(a, b) {
      const r1 = a.getBoundingClientRect();
      const r2 = b.getBoundingClientRect();
      return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
    }

    function endGame() {
      running = false;
      clearInterval(obstacleTimer);
      clearInterval(loopTimer);
      statusEl.textContent = `Fin del juego. Puntuación final: ${score}`;
    }

    function gameLoop() {
      const obstacles = Array.from(document.querySelectorAll('.obstacle'));

      obstacles.forEach((obs) => {
        const y = Number(obs.dataset.y) + 5;
        obs.dataset.y = String(y);
        obs.style.top = `${y}px`;

        if (intersects(obs, player)) {
          obs.remove();
          lives -= 1;
          livesEl.textContent = lives;
          if (lives <= 0) endGame();
          return;
        }

        if (y > game.clientHeight) {
          obs.remove();
          score += 1;
          scoreEl.textContent = score;
        }
      });
    }

    function startGame() {
      running = true;
      score = 0;
      lives = 3;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      statusEl.textContent = '¡Juego en marcha!';

      document.querySelectorAll('.obstacle').forEach((el) => el.remove());
      resetPlayerPosition();

      clearInterval(obstacleTimer);
      clearInterval(loopTimer);
      obstacleTimer = setInterval(createObstacle, 700);
      loopTimer = setInterval(gameLoop, 20);
    }

    window.addEventListener('keydown', (event) => {
      if (!running) return;
      if (event.key === 'ArrowLeft') playerX -= playerSpeed;
      if (event.key === 'ArrowRight') playerX += playerSpeed;
      playerX = Math.max(0, Math.min(game.clientWidth - player.offsetWidth, playerX));
      player.style.left = `${playerX}px`;
    });

    window.addEventListener('resize', resetPlayerPosition);
    startBtn.addEventListener('click', startGame);

    resetPlayerPosition();
  </script>
</body>
</html>
